<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fitness & Diet Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>AI Fitness & Diet Planner</h1>

    <input type="number" id="weight" placeholder="Enter your weight in kg">
    <br><br>

    <input type="number" id="height" placeholder="Enter your height in cm">
    <br><br>

    <input type="number" id="age" placeholder="Enter your age">
    <br><br>

    <select id="goal">
        <option value="loss">Fat Loss</option>
        <option value="maintain">Maintenance</option>
        <option value="gain">Muscle Gain</option>
    </select>
    <br><br>

    <button onclick="calculateCalories()">Generate Plan</button>

    <div id="result"></div>

    <script src="script.js"></script>

</body>
</html>
