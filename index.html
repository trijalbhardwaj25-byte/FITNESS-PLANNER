<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fitness & Nutrition Planner</title>
    <link rel="stylesheet" href="style.css">

    <!-- Chart.js for progress chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>AI Fitness & Nutrition Planner</h1>

        <p class="subtitle">
            Personalized diet, workout, and progress tracking in one place
        </p>

        <input
            type="number"
            id="weight"
            placeholder="Enter your weight (kg)"
        >

        <input
            type="number"
            id="height"
            placeholder="Enter your height (cm)"
        >

        <input
            type="number"
            id="age"
            placeholder="Enter your age"
        >

        <select id="goal">
            <option value="loss">Fat Loss</option>
            <option value="maintain">Maintenance</option>
            <option value="gain">Muscle Gain</option>
        </select>

        <button onclick="calculateCalories()">
            ✨ Generate Smart Fitness Plan
        </button>

        <div id="result"></div>

        <button onclick="saveProgress()">
            📈 Save Current Weight
        </button>

        <div id="progress"></div>

        <canvas id="weightChart"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
